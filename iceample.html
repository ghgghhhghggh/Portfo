<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iceample — Kyliann Chapel, ghgghhhghggh</title>
  <meta name="description" content="">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<body>

  <!-- ===== BARRE DU HAUT ===== -->
  <header class="site-header">
    <nav class="nav container" aria-label="Navigation principale" data-i18n-attr="aria-label:nav.main">
      <a href="index.html" class="logo" translate="no">KC<span>.</span></a>

      <!-- Menu unique : les pages, puis les options d'affichage (langue et thème) -->
      <div class="menu">
        <button class="icon-btn menu-btn" id="menu-btn" data-label="menu" aria-label="Ouvrir le menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu-list">
          <!-- Trois barres fines en pixels (2 px) ; croix du même trait que celle de la barre du bas, en plus grand (14 px) -->
          <svg class="icon-open" width="18" height="16" viewBox="0 0 18 16" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 1h18v2H0z M0 7h18v2H0z M0 13h18v2H0z"/></svg>
          <svg class="icon-close" width="14" height="14" viewBox="0 0 7 7" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 0h1v1h-1z M6 0h1v1h-1z M1 1h1v1h-1z M5 1h1v1h-1z M2 2h1v1h-1z M4 2h1v1h-1z M3 3h1v1h-1z M2 4h1v1h-1z M4 4h1v1h-1z M1 5h1v1h-1z M5 5h1v1h-1z M0 6h1v1h-1z M6 6h1v1h-1z"/></svg>
        </button>
        <div class="menu-list" id="menu-list">
          <ul role="menu">
            <li role="none"><a role="menuitem" href="projets.html" aria-current="page" data-i18n="nav.projets">Projets</a></li>
            <li role="none"><a role="menuitem" href="medias.html" data-i18n="nav.medias">Médias</a></li>
            <li role="none"><a role="menuitem" href="competences.html" data-i18n="nav.competences">Compétences</a></li>
            <li role="none"><a role="menuitem" href="apropos.html" data-i18n="nav.apropos">À propos</a></li>
          </ul>
          <!-- Options d'affichage, séparées des pages par un filet -->
          <div class="menu-options">
            <div class="misc-row">
              <span class="misc-label" data-i18n="misc.lang">Langue</span>
              <span class="misc-options" translate="no">
                <button type="button" data-lang="fr" aria-pressed="true">FR</button>
                <button type="button" data-lang="en" aria-pressed="false">EN</button>
              </span>
            </div>
            <div class="misc-row">
              <span class="misc-label" data-i18n="misc.theme">Thème</span>
              <span class="misc-options">
                <button type="button" data-theme-set="dark" aria-pressed="true" data-i18n="misc.dark">Sombre</button>
                <button type="button" data-theme-set="light" aria-pressed="false" data-i18n="misc.light">Clair</button>
              </span>
            </div>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="section section-page container">
      <div class="section-head reveal">
        <img class="title-logo" src="assets/iceample-logo.png" width="298" height="175" alt="">
        <h1><span translate="no">Iceample</span> <span class="title-sub" data-i18n="iceample.sub">Logiciel et WebApp multifonction</span></h1>
      </div>

      <!-- Haut de page : à gauche, l'emplacement des liens vers les pages de chaque groupe d'outils ;
           à droite, les liens du projet -->
      <div class="project-top reveal">
        <div class="project-tools">
          <!-- Emplacement réservé aux groupes d'outils (Sound, Image, Files…).
               Exemple de lien :
               <a href="iceample-sound.html">Sound</a>
          -->
        </div>
        <ul class="contact-links project-site">
          <li>
            <span class="contact-label" data-i18n="label.site">Site</span>
            <a href="https://iceample.com" target="_blank" rel="noopener noreferrer" translate="no">Iceample.com</a>
          </li>
          <!-- "releases/latest" mène toujours à la dernière version publiée sur GitHub -->
          <li>
            <span class="contact-label" translate="no">Windows</span>
            <a href="https://github.com/ghgghhhghggh/Iceample/releases/latest" target="_blank" rel="noopener noreferrer" data-i18n="label.installer">Installeur (GitHub)</a>
          </li>
        </ul>
      </div>

      <h2 class="subcat-title reveal" data-i18n="iceample.overview">Vue d'ensemble</h2>

      <div class="project-text reveal">
        <!-- Écrivez ici la description détaillée d'Iceample.
             Un bloc <p>...</p> par paragraphe ; <h2>...</h2> pour un intertitre. -->
        <p></p>
      </div>

      <div class="media-grid">
        <!-- La légende se place au-dessus de l'image -->
        <figure class="media card reveal">
          <figcaption data-i18n="iceample.fig.langues">Choix de la langue utilisée</figcaption>
          <img src="assets/iceample-langues.png?v=2" width="446" height="266" alt="Écran de choix de la langue dans Iceample, avec douze langues proposées" data-i18n-attr="alt:iceample.fig.langues.alt">
        </figure>
        <!-- Deuxième bloc : plusieurs parties, chacune avec sa légende au-dessus de son image -->
        <div class="media card reveal">
          <figure class="media-part">
            <figcaption data-i18n="iceample.fig.themes">Préréglages de thèmes</figcaption>
            <img src="assets/iceample-themes.png" width="440" height="80" alt="Dix préréglages de thèmes dans Iceample : Iceample, Arctic, Midnight, Nebula, Ember, Crimson, Aurora, Gold, Neon et Mono" data-i18n-attr="alt:iceample.fig.themes.alt">
          </figure>
          <figure class="media-part">
            <figcaption data-i18n="iceample.fig.reglages">Personnalisation de tous les modules</figcaption>
            <img src="assets/iceample-reglages.png" width="437" height="601" alt="Réglages d'apparence d'Iceample : police, arrondi des fenêtres et une quinzaine de couleurs modifiables" data-i18n-attr="alt:iceample.fig.reglages.alt">
          </figure>
          <figure class="media-part">
            <figcaption data-i18n="iceample.fig.partage">Partage de préréglages de thèmes personnalisés</figcaption>
            <img src="assets/iceample-partage.png" width="436" height="46" alt="Boutons Export et Import d'Iceample" data-i18n-attr="alt:iceample.fig.partage.alt">
          </figure>
        </div>
        <!-- Troisième bloc : le menu principal, puis trois de ses sous-menus ouverts.
             Deux colonnes sur deux lignes, dans un bloc deux fois plus large que les autres. -->
        <figure class="media media-wide card reveal">
          <figcaption data-i18n="iceample.fig.menu">Menu principal et sous-menus</figcaption>
          <div class="media-quad">
            <div><img src="assets/iceample-menu-1.png" width="394" height="269" alt="Menu principal d'Iceample : Files, Image, Animation, Video, Sound, Utilities et Settings" data-i18n-attr="alt:iceample.fig.menu1.alt"></div>
            <div><img src="assets/iceample-menu-2.png" width="394" height="269" alt="Sous-menu Files : Search, Import, Library, Recents, Metadata et Converter" data-i18n-attr="alt:iceample.fig.menu2.alt"></div>
            <div><img src="assets/iceample-menu-3.png" width="394" height="293" alt="Sous-menu Image : 3D, Effects, Palettes, Moodboard, RAW photo, Image editor et Pattern Generator" data-i18n-attr="alt:iceample.fig.menu3.alt"></div>
            <div><img src="assets/iceample-menu-4.png" width="394" height="485" alt="Sous-menu Sound : Mixer, Delay, Player, Mic track, Sequencer, Metronome, Audio track, Sound editor, Virtual piano et Master Equalizer" data-i18n-attr="alt:iceample.fig.menu4.alt"></div>
          </div>
        </figure>
        <!-- Ajoutez ici les autres images d'Iceample.
             Exemple de bloc :
             <figure class="media card reveal">
               <figcaption>Légende</figcaption>
               <img src="assets/iceample-1.jpg" alt="Description de l'image">
             </figure>
        -->
      </div>
    </section>
